[project]
name = "ep-physics-base"
version = "0.1.0"
description = "Units, the `(result, events)` event helper, configuration with packaged defaults, the bootstrap and decision statistics, the tag vocabulary, name keys, and the "
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "AdmcCarthy", email = "24669992+AdmcCarthy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
figures = ["matplotlib", "cycler"]



[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E702", "E731", "E741"]
