# Unit conversion factors -- configuration, not code (AGENTS.md rule 3C.5).
# Referenced by name from code and from source adapters.

constants:
  ft_to_m: 0.3048
  in_to_mm: 25.4
  # Energy / volume equivalents (Norwegian Offshore Directorate conventions)
  sm3_gas_per_sm3_oe: 1000.0     # 1 Sm3 o.e. = 1000 Sm3 gas
  ngl_sm3_oe_per_tonne: 1.9      # 1 tonne NGL = 1.9 Sm3 o.e. (verified against NPD field_reserves OE totals)
  bbl_per_sm3: 6.2898            # barrels per standard cubic metre of oil / o.e.
  scf_per_sm3: 35.3147           # standard cubic feet per Sm3 gas
  psi_per_bar: 14.5038           # PVT correlations (Standing) are written in psia, degF and scf/stb; the pipeline converts at the edges (src/processing/pvt.py)

# A force logged as 'TON' (mud-log weight on bit and hookload) does not say WHICH ton: metric tonne-force, US short ton-force or imperial long ton-force (Adam, 2026-11-10;
# an earlier statement that it is a metric tonne was an error).  The kind is unresolved: the native value is kept and a band over the three kinds is the most that can be said.
# kN per unit = mass in kg x 9.80665 m/s2 / 1000 (1000 kg, 907.18474 kg, 1016.0469088 kg).
force_ton_candidates:
  metric_tonne_force: 9.80665
  us_short_ton_force: 8.896443
  imperial_long_ton_force: 9.964016

# Per-row length conversion: normalised unit token -> metres
length_to_metres:
  m: 1.0
  ft: 0.3048

# Units that occur in free text (well histories) -> canonical metric unit.  value_out = value * scale + offset.
# Keys are normalised: lower case, no spaces, '³' written as '3'.  Used by src/processing/well_history.py (rules: config/well_history_rules.yaml).
# Text rates are read as standard conditions (Sm3) when the text says m3: a text 'm3/day' of oil or gas is almost always Sm3 in Sodir histories.
text_units:
  rate_liquid:                      # -> Sm3/d
    canonical: Sm3/d
    units: {sm3: 1.0, m3: 1.0, bbl: 0.158987, bbls: 0.158987, stb: 0.158987, bopd: 0.158987, bpd: 0.158987}     # 0.158987 = 1 / bbl_per_sm3
  rate_gas:                         # -> Sm3/d
    canonical: Sm3/d
    units: {sm3: 1.0, m3: 1.0, msm3: 1000000.0, mmsm3: 1000000.0, scf: 0.0283168, mscf: 28.3168, mmscf: 28316.8}   # 0.0283168 = 1 / scf_per_sm3
  choke:                            # -> mm   ('/64 inch' chokes use the unit '64ths' below)
    canonical: mm
    units: {mm: 1.0, '"': 0.396875, in: 0.396875, inch: 0.396875, inches: 0.396875, '': 0.396875}                  # 1/64 inch = 0.396875 mm (the value is the number of 64ths)
  gor:                              # -> Sm3/Sm3
    canonical: Sm3/Sm3
    units: {sm3/sm3: 1.0, m3/m3: 1.0, scf/stb: 0.17811, scf/bbl: 0.17811}                                          # = bbl_per_sm3 / scf_per_sm3
  density:                          # -> g/cm3
    canonical: g/cm3
    units: {g/cm3: 1.0, g/cc: 1.0, kg/m3: 0.001, sg: 1.0}
  api:                              # -> degAPI (kept as published)
    canonical: degAPI
    units: {api: 1.0, '': 1.0}
  pressure:                         # -> bar
    canonical: bar
    units: {bar: 1.0, bars: 1.0, bara: 1.0, barg: 1.0, psi: 0.0689476, psia: 0.0689476, psig: 0.0689476, mpa: 10.0, kpa: 0.01}
  gradient:                         # -> bar/m
    canonical: bar/m
    units: {bar/m: 1.0, psi/ft: 0.226206}
  temperature:                      # -> degC
    canonical: degC
    units: {c: 1.0, f: {scale: 0.5555556, offset: -17.7777778}}     # a mapping gives scale and offset (degF -> degC)
  ppm:                              # -> ppm
    canonical: ppm
    units: {ppm: 1.0, '%': 10000.0}
  percent:                          # -> %
    canonical: "%"
    units: {'%': 1.0, mol%: 1.0, vol%: 1.0, percent: 1.0, p.u.: 1.0, pu: 1.0, ppm: 0.0001}
  length:                           # -> m
    canonical: m
    units: {m: 1.0, metres: 1.0, meters: 1.0, ft: 0.3048}
  permeability:                     # -> mD
    canonical: mD
    units: {md: 1.0, millidarcy: 1.0, millidarcies: 1.0, d: 1000.0, darcy: 1000.0, darcies: 1000.0}

# Native volume-unit tokens used in adapters -> multiplier to the base unit.
# Base unit is Sm3 (oil, gas, condensate, o.e.) or tonnes (NGL mass).
volume_unit_multipliers:
  Sm3: 1.0
  MillSm3: 1000000.0      # million Sm3
  BillSm3: 1000000000.0      # billion Sm3 (gas; 1 BillSm3 gas = 1 MillSm3 o.e.)
  tonnes: 1.0
  Mtonnes: 1000000.0      # million tonnes
  m3: 1.0                 # cubic metre; a source that says m3 for a produced volume is read as standard conditions (Sm3), an ASSUMPTION stated in that source's adapter
  ksm3: 1000.0            # thousand Sm3 (gas volumes of the UK production reports)

